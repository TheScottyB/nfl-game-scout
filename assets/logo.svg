<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Outer scouting reticle ring -->
  <circle cx="64" cy="64" r="46" stroke="#10B981" stroke-width="3.5" stroke-dasharray="10 6" opacity="0.85"/>
  <!-- Crosshair ticks -->
  <line x1="64" y1="12" x2="64" y2="24" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="104" x2="64" y2="116" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="24" y2="64" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="104" y1="64" x2="116" y2="64" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tilted football silhouette -->
  <g transform="rotate(-35 64 64)">
    <ellipse cx="64" cy="64" rx="34" ry="20" fill="#B45309" stroke="#F59E0B" stroke-width="3.5"/>
    <!-- Stripes -->
    <path d="M41 49.5C43.5 56 43.5 72 41 78.5" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round"/>
    <path d="M87 49.5C84.5 56 84.5 72 87 78.5" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round"/>
    <!-- Laces -->
    <line x1="51" y1="64" x2="77" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="59" x2="56" y2="69" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="64" y1="59" x2="64" y2="69" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="59" x2="72" y2="69" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
